name: docker-publish

# Build the production image, push it to GHCR, then deploy it: every push to
# main -> ghcr.io/faneaatiku/cosmos-json:<sha8> (commit short-SHA, pinned
# versions everywhere — no "latest") -> json.vibast.ro.
#
# Pure Vite static bundle served by nginx — no build-time env, so nothing is checked out
# from the deploy repo (vibast-solutions/vibast-deploy) here; only its
# `deploy` workflow is used.
#
# After a successful push — on push events only; a workflow_dispatch build
# never deploys — the job dispatches the deploy repo's `deploy` workflow for
# json.vibast.ro with the DEPLOY_REPO_TOKEN secret and waits for it: a failed
# release on the server = red job here. (This workflow runs on push only, so
# fork PRs never see the token. Do not add a pull_request trigger.)
on:
  push:
    branches: [main]
  workflow_dispatch:   # rebuild + push only, no deploy

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  DEPLOY_REPO: vibast-solutions/vibast-deploy
  DEPLOY_DIR: json.vibast.ro   # the target's dir in the deploy repo = ~/apps/<dir> on the server

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        # --short=8 pinned: the tag is always the first 8 chars of the sha, so
        # it can be derived from any commit listing without asking git.
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # `gh workflow run` returns no run id, so the run is found by its title
      # (the deploy workflow sets run-name: deploy <app> <tag>) among the runs
      # created after this dispatch (minus a minute of clock skew). Waiting on
      # it makes a failed release on the server a red job here.
      - name: Deploy (dispatch the deploy repo's workflow and wait for it)
        if: github.event_name == 'push'
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          APP: ${{ env.DEPLOY_DIR }}
          TAG: ${{ steps.vars.outputs.sha }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="deploy $APP $TAG"
          SINCE=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          export TITLE SINCE
          gh workflow run deploy.yml -R "$DEPLOY_REPO" -f app="$APP" -f tag="$TAG" -f source="$SOURCE" >/dev/null
          run_id=""
          for _ in $(seq 1 20); do
            sleep 5
            run_id=$(gh run list -R "$DEPLOY_REPO" --workflow deploy.yml -L 30 \
              --json databaseId,displayTitle,createdAt \
              --jq '[.[] | select(.displayTitle == env.TITLE and .createdAt >= env.SINCE)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::dispatched '$TITLE' but no matching run appeared in the deploy repo within 100s"
            exit 1
          fi
          # This repo is public: its logs and summary must not carry the deploy repo's
          # run URL or step output, so the run is watched silently.
          if gh run watch "$run_id" -R "$DEPLOY_REPO" --interval 10 --exit-status >/dev/null 2>&1; then
            echo "✅ deploy \`$APP\` \`$TAG\` succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ deploy \`$APP\` \`$TAG\` FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::deploy of $APP $TAG failed, see the deploy repo's Actions (the previous tag stays live)"
            exit 1
          fi
